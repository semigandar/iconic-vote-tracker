name: Iconic Vote Monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-votes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas matplotlib
          playwright install chromium

      - name: Run vote scraper and generate charts
        run: |
          python scraper.py
          python plot.py

      - name: Commit updated CSV and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add votes.csv total_votes.png vote_spikes.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update vote counts and charts" && git push)
